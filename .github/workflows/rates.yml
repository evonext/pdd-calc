name: Обновить курсы
on:
  schedule:
    - cron: "40 12 * * *"   # 17:40 Алматы — после публикации курса НБРК
    - cron: "10 1 * * *"    # 06:10 Алматы — запасной запуск
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/update_rates.py
      - name: Commit
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add rates.json
          if ! git diff --cached --quiet; then git commit -m "Курсы $(date -u +%F)" && git push; fi
